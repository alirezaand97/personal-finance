<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 640 640"
>
  <defs>
    <linearGradient id="background" x1="80" y1="60" x2="570" y2="600">
      <stop offset="0%" stop-color="oklch(0.66 0.20 258)" />
      <stop offset="45%" stop-color="oklch(0.55 0.21 260)" />
      <stop offset="100%" stop-color="oklch(0.43 0.20 268)" />
