<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 640 640"
>
  <defs>
    <linearGradient
      id="bg"
      x1="70"
      y1="50"
      x2="570"
      y2="590"
    >
      <stop offset="0%" stop-color="#6B9BFF"/>
      <stop offset="48%" stop-color="#416FE8"/>
      <stop offset="100%" stop-color="#294BC5"/>
    </linearGradient>

    <linearGradient
      id="mark"
      x1="170"
      y1="450"
      x2="470"
      y2="210"
    >
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E9EFFF"/>
    </linearGradient>

    <radialGradient
      id="glow"
      cx="50%"
      cy="30%"
      r="72%"
    >
      <stop
        offset="0%"
        stop-color="#FFFFFF"
        stop-opacity=".18"
      />
      <stop
        offset="100%"
        stop-color="#FFFFFF"
        stop-opacity="0"
      />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect
    x="24"
    y="24"
    width="592"
    height="592"
    rx="150"
    fill="url(#bg)"
  />

  <!-- Soft glow -->
  <circle
    cx="320"
    cy="245"
    r="270"
    fill="url(#glow)"
  />

  <!-- Main mark -->
  <path
    d="
      M168 426
      L268 326
      L340 398
      L468 270
    "
    fill="none"
    stroke="url(#mark)"
    stroke-width="58"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Inner flow -->
  <path
    d="
      M208 426
      L268 366
      L316 414
    "
    fill="none"
    stroke="#416FE8"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity=".28"
  />

  <!-- Small investment dot -->
  <circle
    cx="468"
    cy="270"
    r="17"
    fill="#FFFFFF"
  />

  <!-- Subtle bottom balance -->
  <path
    d="M168 470H410"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="12"
    stroke-linecap="round"
    opacity=".12"
  />
</svg>
